[project]
name = "outboxexpress"
version = "0.1.0"
description = "Flash Order Notifier — a transactional outbox study"
requires-python = "==3.14.*"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.3",
    "sqlalchemy==2.0.52",
    "psycopg[binary]==3.3.4",
    "alembic==1.19.1",
    "pydantic[email]==2.13.4",
    "pydantic-settings==2.15.0",
    "structlog==26.1.0",
    "confluent-kafka==2.15.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "testcontainers==4.15.0",
    "httpx==0.28.1",
    "ruff==0.16.3",
    "pyright==1.1.411",
]

[project.scripts]
outbox-api = "outboxexpress.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outboxexpress"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# ruff formats Python blocks inside Markdown; keep it away from the design docs.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["src", "tests", "migrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
